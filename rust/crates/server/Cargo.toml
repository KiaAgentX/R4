[package]
name = "dropagentx-server"
description = "دروازه HTTP — axum، امنیت چندلایه، X-KIA-Key (فاز ۴)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# وب / async — همان تصمیم‌های فاز ۰ (ADR-009)
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# کرِیت‌های داخلی — سرور نقطهٔ اتصال همهٔ لایه‌هاست
dropagentx-contracts = { workspace = true }
dropagentx-domain = { workspace = true }
dropagentx-db = { workspace = true }
# فاز ۵ — قلب خالص بات (orchestrator + DTOهای وایر) اینجا روی StoreEnv می‌نشیند
dropagentx-bot = { workspace = true }

[dev-dependencies]
# oneshot (معادل app.inject فستیفای) — تست‌های سرور
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[[bin]]
name = "dropagentx-server"
path = "src/main.rs"
