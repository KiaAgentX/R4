[package]
name = "dropagentx-ai"
description = "گیت‌وی AI — fallback سه‌اسلات، پاکت سخت، redaction، سقف روزانه (فاز ۶)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# قرارداد وایر — انواع چت/ایجنت/مهارت از فاز ۳
dropagentx-contracts = { workspace = true }
# پاکت + ردیف مصرف — serde typed
serde = { workspace = true }
serde_json = { workspace = true }
# کلاینت OpenAI-سازگار — rustls (همان تصمیم ورک‌اسپیس)، timeout با tokio::time
reqwest = { workspace = true }
tokio = { workspace = true }
# ۹ قاعدهٔ redaction — الگوهای کامپایل‌شدهٔ LazyLock
regex = "1.11"
# خطاهای تایپ‌شدهٔ کتابخانه
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# تست‌های async موتور — بدون شبکه (FakeProvider)
tokio = { workspace = true }
