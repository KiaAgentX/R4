<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent-One — اپ شهروندان</title>
    <!-- iOS standalone hooks (Step 6): apple-touch icon + safe-area chrome.
         Safe-area insets are consumed by .aur-bottomnav (env(safe-area-inset-*))
         which already ships in webapp.css. The service worker belongs to the
         strategic shell at "/" — this area is covered by its scope. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent-One" />
    <!-- Telegram Mini App bridge: identity degrades honestly when blocked -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
